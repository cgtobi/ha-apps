---
configuration:
  import_mode:
    name: Import mode
    description: >-
      How activities are imported: `stravaApi` (from the Strava API, requires the Strava credentials below) or `files` (import `.fit`/`.tcx`/`.gpx` files you provide).
  strava_client_id:
    name: Strava client ID
    description: >-
      OAuth client ID from your Strava API application. Required only when import mode is `stravaApi`.
  strava_client_secret:
    name: Strava client secret
    description: >-
      OAuth client secret from your Strava API application. Required only when import mode is `stravaApi`.
  strava_refresh_token:
    name: Strava refresh token
    description: >-
      Refresh token used to obtain access tokens for Strava API requests. Required only when import mode is `stravaApi`.
  tz:
    name: Time zone
    description: >-
      Container time zone (for example `Etc/GMT` or `Europe/Berlin`).
  app_url:
    name: App URL
    description: >-
      The URL you reach the app on, including the port if used. Required; the app will not start without it. For Home Assistant ingress a value like `http://localhost:8080` is fine; set a real URL for direct access and webhooks.
  admin_username:
    name: Admin username
    description: >-
      Username for the built-in admin panel login.
  admin_password:
    name: Admin password
    description: >-
      Password for the built-in admin panel login. Required; the admin panel needs a login. The add-on hashes it before passing it to the app.
  admin_allowed_ips:
    name: Admin panel IP allowlist
    description: >-
      Optional comma-separated IP addresses or CIDR ranges allowed to reach the admin panel, for example `192.168.1.50, 192.168.4.0/24`. Empty means no restriction. Other addresses get a `404` for `/admin`; the rest of the app is unaffected. Home Assistant ingress keeps working regardless. Has little effect while `trust_forwarded_headers` is on and the port is reachable from your LAN.
  dreeve_api_key:
    name: API key
    description: >-
      Bearer token for the app's `/api/v1` HTTP API (activity upload, used by GadgetBridge). Leave empty to keep the API closed; every request is then rejected. Generate a key in the admin panel under Settings, Security. The API is not reachable through ingress, it needs port `8080/tcp` exposed.
  dreeve_mcp_key:
    name: MCP key
    description: >-
      Bearer token for the app's read-only MCP server at `/mcp`, which lets AI clients such as Claude Code, Claude Desktop or Cursor read your activities and metrics. Leave empty to keep it closed; every request is then rejected. Generate a key in the admin panel under Settings, Security, MCP access. Not reachable through ingress, it needs port `8080/tcp` exposed. The admin panel IP allowlist does not apply to it.
  oidc_issuer_url:
    name: Single sign-on issuer URL
    description: >-
      Issuer URL of your OpenID Connect identity provider (Authentik, Keycloak, Authelia, Pocket ID and the like), for signing in to the admin panel with single sign-on. The add-on reads `<issuer>/.well-known/openid-configuration` from it. Single sign-on turns on only when all four `oidc_` options are set, and only works on port `8080/tcp`, not through ingress. The password login keeps working either way.
  oidc_client_id:
    name: Single sign-on client ID
    description: >-
      Client ID of the client you created for Dreeve at your identity provider.
  oidc_client_secret:
    name: Single sign-on client secret
    description: >-
      Client secret of that client. Dreeve signs in as a confidential client with a secret.
  oidc_allowed_users:
    name: Single sign-on allowed users
    description: >-
      Who may sign in, one entry per user: the user's subject (`sub`) at the identity provider, or their email address, which only counts when the provider reports it as verified. Anyone else is turned away after signing in at the provider.
  ai_api_key:
    name: AI assistant API key
    description: >-
      API key for the AI workout assistant, when it runs on a cloud provider (Anthropic, OpenAI, Gemini, Mistral, OpenRouter and the rest). A self-hosted `ollama` needs no key, leave this empty for it. Which provider and model to use is set in the admin panel under Settings, Integrations; this key is the only part of it that lives here. The assistant is reachable through Home Assistant ingress only, not on port `8080/tcp`.
  trust_forwarded_headers:
    name: Trust forwarded headers on the direct port
    description: >-
      Whether `X-Forwarded-*` headers are believed on the direct `8080/tcp` port. Leave off unless that port sits behind your own reverse proxy terminating TLS; turning it on where the port is reachable from the LAN lets any client there choose the host the admin login redirects to. Ingress is unaffected.
  expose_share:
    name: Expose file-import watch directory
    description: >-
      Expose the file-import watch directory over the add-on's mapped config directory (SMB/CIFS) so you can drop `.fit`/`.tcx`/`.gpx` files into it. Used with import mode `files`.
  caddy_log_level:
    name: Caddy log level
    description: >-
      Log verbosity for the embedded web server (`DEBUG`, `INFO`, `WARN`, or `ERROR`).
network:
  8080/tcp: Dreeve web UI

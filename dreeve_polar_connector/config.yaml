name: "Dreeve Polar Connector"
version: "0.1.12"
slug: "dreeve_polar_connector"
description: "Imports Polar Flow training sessions into Dreeve"
url: "https://github.com/dreeveapp/dreeve-polar-connector"
stage: experimental
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
homeassistant: "2025.1.0"
changelog: true

# Published on the host, not behind ingress: authorizing with Polar is an OAuth redirect back to a
# URL that must be registered with the Polar client beforehand, and an ingress URL carries a session
# token that changes on every add-on restart.
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Polar authorization page and status endpoint"
webui: "http://[HOST]:[PORT:8080]/authorize"

# Liveness only: the status server listens exactly while the sync process is alive. Deliberately not
# an HTTP check against the connector's /healthz, which reports unhealthy until someone has
# authorized and again after missed cycles - neither of which a restart repairs.
watchdog: "tcp://[HOST]:[PORT:8080]"

# Write access to every add-on's config dir, so this add-on can deliver into the Dreeve add-on's
# watch folder (which lives there when the Dreeve add-on has expose_share enabled).
map:
  - all_addon_configs:rw

options:
  polar_client_id: ""
  polar_client_secret: ""
  public_url: ""
  redirect_uri: ""
  since: "-30d"
  tz: "Etc/GMT"
  watch_dir: ""
  log_level: "info"
  extra_env: []

schema:
  polar_client_id: str
  polar_client_secret: password?
  public_url: str?
  redirect_uri: str?
  since: str?
  tz: str
  watch_dir: str?
  log_level: "list(debug|info|warning|error|critical)"
  extra_env:
    - str

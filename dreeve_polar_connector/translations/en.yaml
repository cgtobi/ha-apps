configuration:
  polar_client_id:
    name: Polar client ID
    description: >-
      From the client you created at admin.polaraccesslink.com.
  polar_client_secret:
    name: Polar client secret
    description: >-
      From the same client. Needed to authorize; you may clear it afterwards.
  public_url:
    name: Public URL
    description: >-
      Where this add-on is reachable in a browser, for example http://homeassistant.local:8080. Its
      /callback must be registered as a redirect URL with your Polar client. Leave empty only if the
      client has exactly one registered redirect URL.
  redirect_uri:
    name: Redirect URI
    description: >-
      Only needed when Polar refuses the usual <public_url>/callback with "Oops, something went wrong
      somewhere along the way." Set it to a URL your Polar client actually accepts, often the bare
      origin such as http://homeassistant.local:8080. Sent to Polar exactly as typed, trailing slash
      included, and the add-on answers the callback at / as well.
  since:
    name: Import history from
    description: >-
      How far back the first run reaches: a date (2026-07-01), an offset (-30d, 720h) or now. Polar
      keeps 30 days. Ignored after the first run.
  tz:
    name: Timezone
    description: Timezone used for log timestamps and date comparisons.
  watch_dir:
    name: Watch folder
    description: >-
      Leave empty to auto-detect the Dreeve add-on's watch folder. Set it only if auto-detection
      finds more than one candidate.
  log_level:
    name: Log level
    description: How much the connector writes to the add-on log.
  weight_sync:
    name: Sync weight to Dreeve
    description: >-
      Record your Polar weight in Dreeve whenever it changes. Needs a Dreeve API key below. Only real
      readings are sent, never Polar's default or estimate, filed under the day the weight changed.
  dreeve_api_key:
    name: Dreeve API key
    description: >-
      A Dreeve API key (drv_...), generated in Dreeve's admin panel under Settings, Security. Put the
      same key into the Dreeve add-on's own API key option, or Dreeve rejects it. The MCP key (drvm_...)
      does not work here.
  dreeve_url:
    name: Dreeve address
    description: >-
      Leave empty: the add-on works out the Dreeve add-on's address from its watch folder. Set it only
      when Dreeve runs elsewhere, or when the watch folder was set by hand.
  weight_unit:
    name: Weight unit
    description: >-
      The unit system Dreeve is set to under Appearance: kg for Metric, lb for Imperial. Dreeve reads
      the number in that unit, so a mismatch stores 80 kg as 80 lb.
  extra_env:
    name: Extra settings
    description: >-
      Additional connector settings as KEY=VALUE, for example SPORTS=running,cycling or
      POLL_INTERVAL=1800. POLAR_TOKENS, STATE_DIR, WATCH_DIR and HTTP_ADDR are managed by the add-on
      and cannot be set here.

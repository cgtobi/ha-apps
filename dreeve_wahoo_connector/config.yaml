name: "Dreeve Wahoo Connector"
version: "0.1.1"
slug: "dreeve_wahoo_connector"
description: "Imports Wahoo workouts into Dreeve"
url: "https://github.com/dreeveapp/dreeve-wahoo-connector"
stage: experimental
# Upstream publishes a linux/amd64-only image (verified with `docker buildx imagetools inspect`);
# claiming aarch64 here would offer the add-on on ARM Home Assistant hosts where the base image
# cannot even be pulled. Add aarch64 back once upstream builds a multi-arch image.
arch:
  - amd64
startup: services
boot: auto
init: false
homeassistant: "2025.1.0"
changelog: true

# Published on the host, not behind ingress: authorizing with Wahoo is an OAuth redirect back to a URL
# registered with the Wahoo application beforehand, and an ingress URL carries a session token that
# changes on every add-on restart. 8085 is upstream's own default port, so its documentation and the
# Wahoo portal examples need no translation, and it leaves the Polar connector's published 8080 alone
# so both add-ons can run unmodified.
ports:
  8085/tcp: 8085
ports_description:
  8085/tcp: "Wahoo authorization dashboard and status endpoint"
webui: "http://[HOST]:[PORT:8085]/"

# Liveness only: the dashboard listens exactly while the app is alive. Deliberately not an HTTP check
# against /api/status, which reports authenticated=false until someone has authorized - which no
# restart repairs.
watchdog: "tcp://[HOST]:[PORT:8085]"

# Write access to every add-on's config dir, so this add-on can deliver into the Dreeve add-on's
# watch folder (which lives there when the Dreeve add-on has expose_share enabled).
map:
  - all_addon_configs:rw

options:
  wahoo_client_id: ""
  wahoo_client_secret: ""
  redirect_uri: ""
  sync_time_window: "1_week"
  sync_cron: "0 * * * *"
  tz: "Etc/GMT"
  watch_dir: ""
  log_level: "info"
  extra_env: []

schema:
  wahoo_client_id: str
  wahoo_client_secret: password?
  redirect_uri: str?
  sync_time_window: list(1_day|1_week|1_month|1_year|all_time)
  sync_cron: str?
  tz: str
  watch_dir: str?
  log_level: "list(debug|info|warning|error|critical)"
  extra_env:
    - str

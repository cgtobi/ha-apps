monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - strava-api
    handlers:
        strava-api:
            type:  rotating_file
            max_files: 5
            path: "/data/storage/files/logs/strava-api.log"
            level: info
            channels: ["strava-api"]
        console-output:
            type: rotating_file
            max_files: 5
            path: "/data/storage/files/logs/console-output.log"
            level: info
            channels: ["console-output"]
        daemon:
          type: rotating_file
          max_files: 5
          path: "/data/storage/files/logs/daemon.log"
          level: info
          channels: ["daemon"]
        webhooks:
          type: rotating_file
          max_files: 5
          path: "/data/storage/files/logs/webhooks.log"
          level: info
          channels: ["webhooks"]
        errors:
          type: rotating_file
          max_files: 5
          path: "/data/storage/files/logs/errors.log"
          level: error
          channels: ["errors"]
          formatter: monolog.formatter.errors
        # Add-on only: errors also go to the add-on log. Home Assistant offers no
        # way to open /data, so errors.log alone is out of reach for most users,
        # yet the login page sends them there when single sign-on fails, and a
        # "500" page names a Reference code that only that file explains. Same
        # level and formatter as the file, so both carry the same entries.
        errors-addon-log:
          type: stream
          path: "php://stderr"
          level: error
          channels: ["errors"]
          formatter: monolog.formatter.errors

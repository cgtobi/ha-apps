configuration:
  polar_client_id:
    name: Polar-Client-ID
    description: >-
      Aus dem Client, den du auf admin.polaraccesslink.com erstellt hast.
  polar_client_secret:
    name: Polar-Client-Secret
    description: >-
      Aus demselben Client. Für die Autorisierung nötig; danach kann es geleert werden.
  public_url:
    name: Öffentliche URL
    description: >-
      Unter welcher Adresse dieses Add-on im Browser erreichbar ist, zum Beispiel
      http://homeassistant.local:8080. Deren /callback muss als Redirect-URL im Polar-Client
      eingetragen sein. Nur leer lassen, wenn der Client genau eine Redirect-URL hat.
  redirect_uri:
    name: Redirect-URI
    description: >-
      Nur nötig, wenn Polar das übliche <public_url>/callback mit "Oops, something went wrong somewhere
      along the way." ablehnt. Dann hier eine URL eintragen, die der Polar-Client tatsächlich
      akzeptiert, oft die reine Origin wie http://homeassistant.local:8080. Wird unverändert an Polar
      geschickt, inklusive abschließendem Schrägstrich; das Add-on beantwortet den Callback auch unter /.
  since:
    name: Verlauf importieren ab
    description: >-
      Wie weit der erste Durchlauf zurückreicht: ein Datum (2026-07-01), ein Abstand (-30d, 720h)
      oder now. Polar hält 30 Tage vor. Danach ohne Wirkung.
  tz:
    name: Zeitzone
    description: Zeitzone für Log-Zeitstempel und Datumsvergleiche.
  watch_dir:
    name: Überwachungsordner
    description: >-
      Leer lassen, um den Überwachungsordner des Dreeve-Add-ons automatisch zu finden. Nur setzen,
      wenn dabei mehrere Kandidaten gefunden werden.
  log_level:
    name: Protokollstufe
    description: Wie viel der Connector ins Add-on-Log schreibt.
  weight_sync:
    name: Gewicht an Dreeve übertragen
    description: >-
      Überträgt dein Gewicht aus Polar nach Dreeve, sobald es sich ändert. Braucht unten einen
      Dreeve-API-Schlüssel. Übertragen werden nur echte Messwerte, nie Polars Standard- oder Schätzwert,
      eingetragen für den Tag, an dem sich das Gewicht geändert hat.
  dreeve_api_key:
    name: Dreeve-API-Schlüssel
    description: >-
      Ein Dreeve-API-Schlüssel (drv_...), erzeugt im Admin-Panel von Dreeve unter Einstellungen,
      Sicherheit. Derselbe Schlüssel gehört auch in die API-Schlüssel-Option des Dreeve-Add-ons, sonst
      lehnt Dreeve ihn ab. Der MCP-Schlüssel (drvm_...) funktioniert hier nicht.
  dreeve_url:
    name: Dreeve-Adresse
    description: >-
      Leer lassen: Das Add-on ermittelt die Adresse des Dreeve-Add-ons aus dessen Watch-Ordner. Nur
      setzen, wenn Dreeve woanders läuft oder der Watch-Ordner von Hand gesetzt wurde.
  weight_unit:
    name: Gewichtseinheit
    description: >-
      Das Einheitensystem, auf das Dreeve unter Darstellung eingestellt ist: kg für metrisch, lb für
      imperial. Dreeve liest die Zahl in dieser Einheit, bei einer Abweichung werden aus 80 kg also
      80 lb.
  extra_env:
    name: Zusätzliche Einstellungen
    description: >-
      Weitere Connector-Einstellungen als KEY=VALUE, zum Beispiel SPORTS=running,cycling oder
      POLL_INTERVAL=1800. POLAR_TOKENS, STATE_DIR, WATCH_DIR und HTTP_ADDR verwaltet das Add-on
      selbst und kann hier nicht gesetzt werden.
